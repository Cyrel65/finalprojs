<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Achieva - Reset Teacher Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #9B4EA8, #8B2535);
            height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px; }
        h2 { color: #8B2535; margin-bottom: 10px; font-weight: 900; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #8B2535; color: white;
            font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #721c2a; }
        .error { color: #8B2535; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .success { color: #2e7d32; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h2>New Password</h2>
    <p>Please enter your new password for your Achieva Teacher account.</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:if="${success == null}" th:action="@{/teacher/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <input type="password" name="newPassword" placeholder="New Password" required minlength="6">
        <input type="password" name="confirmPassword" placeholder="Confirm New Password" required>
        <button type="submit">UPDATE PASSWORD</button>
    </form>

    <div th:if="${success}" style="margin-top: 20px; text-align: center;">
        <p>You can now return to the Achieva App to sign in.</p>
    </div>
</div>
</body>
</html>
