<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Archiva - Reset Teacher Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--a:#7571f9;--a2:#a78bfa;--a3:#38bdf8;--gbd:rgba(255,255,255,.10);--gbs:rgba(255,255,255,.16);--bg:#06070f;--th:rgba(255,255,255,.92);--tm:rgba(255,255,255,.55);--tl:rgba(255,255,255,.30);--r:18px;--rs:11px;--t:.22s cubic-bezier(.4,0,.2,1);}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html,body{
            min-height:100vh;
            font-family:'DM Sans',sans-serif;
            background:
                radial-gradient(ellipse 90% 70% at 20% -5%, rgba(117,113,249,.20) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 105%, rgba(56,189,248,.13) 0%, transparent 60%),
                #06070f;
            display:flex;align-items:center;justify-content:center;
            color:var(--tm);-webkit-font-smoothing:antialiased;
        }
        body::before{
            content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.030;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size:200px 200px;
        }
        ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(117,113,249,.35);border-radius:99px;}

        .card{
            position:relative;z-index:1;
            background:rgba(255,255,255,.042);
            backdrop-filter:blur(28px) saturate(160%);
            -webkit-backdrop-filter:blur(28px) saturate(160%);
            border:1px solid var(--gbs);
            border-radius:var(--r);
            box-shadow:0 0 0 1px rgba(117,113,249,.10), 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
            padding:48px 44px 44px;
            width:90%;max-width:420px;
            overflow:hidden;
            animation:fadeSlideUp .55s ease both;
        }
        /* Rainbow top bar */
        .card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--a),var(--a2),var(--a3));border-radius:var(--r) var(--r) 0 0;}
        /* Top inner highlight */
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);}

        .brand{text-align:center;margin-bottom:28px;}
        .brand h2{
            font-family:'Syne',sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:-.03em;
            background:linear-gradient(135deg,#fff 30%,var(--a2));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            display:inline-block;margin-bottom:8px;
        }
        .brand p{color:var(--tl);font-size:.85rem;margin:0;}
        .brand-bar{display:block;width:32px;height:3px;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:99px;margin:10px auto 0;}

        input[type="password"]{
            width:100%;background:rgba(255,255,255,.055);border:1px solid var(--gbd);
            border-radius:var(--rs);color:var(--th);font-family:'DM Sans',sans-serif;
            font-size:.9rem;padding:13px 18px;margin:10px 0;outline:none;
            transition:border-color var(--t),box-shadow var(--t),background var(--t);
        }
        input[type="password"]:focus{background:rgba(255,255,255,.085);border-color:var(--a);box-shadow:0 0 0 3px rgba(117,113,249,.22);}
        input[type="password"]::placeholder{color:var(--tl);}

        button[type="submit"]{
            width:100%;padding:13px 24px;margin-top:20px;
            background:linear-gradient(135deg,#7571f9 0%,#a78bfa 100%);
            border:none;border-radius:var(--rs);color:#fff;
            font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.04em;
            cursor:pointer;box-shadow:0 4px 24px rgba(117,113,249,.45);
            transition:all var(--t);position:relative;overflow:hidden;
        }
        button[type="submit"]::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .55s ease;}
        button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(117,113,249,.60);filter:brightness(1.08);}
        button[type="submit"]:hover::before{left:140%;}

        .error-msg{
            background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.28);
            border-radius:var(--rs);color:#fca5a5;font-size:.84rem;font-weight:500;
            padding:12px 16px;margin-bottom:16px;
        }
        .success-msg{
            background:rgba(34,211,160,.10);border:1px solid rgba(34,211,160,.28);
            border-radius:var(--rs);color:#6ee7b7;font-size:.84rem;font-weight:500;
            padding:12px 16px;margin-bottom:16px;
        }
        .post-success{
            text-align:center;margin-top:20px;color:var(--tl);font-size:.84rem;line-height:1.6;
        }

        @keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <h2>Archiva</h2>
        <span class="brand-bar"></span>
        <p style="margin-top:10px;">Reset Teacher Password</p>
    </div>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>
    <div th:if="${success}" class="success-msg" th:text="${success}"></div>

    <form th:if="${success == null}" th:action="@{/teacher/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <input type="password" name="newPassword" placeholder="New Password" required minlength="6">
        <input type="password" name="confirmPassword" placeholder="Confirm New Password" required>
        <button type="submit">
            🔒 UPDATE PASSWORD
        </button>
    </form>

    <div th:if="${success}" class="post-success">
        <p>You can now return to the Archiva App to sign in.</p>
    </div>
</div>
</body>
</html>
