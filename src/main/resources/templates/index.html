<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Archiva - Student Performance Tracker System</title>
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon.png">
    <link href="css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--a:#7571f9;--a2:#a78bfa;--a3:#38bdf8;--gb:rgba(255,255,255,.042);--gh:rgba(255,255,255,.075);--gbd:rgba(255,255,255,.10);--gbs:rgba(255,255,255,.16);--gs:0 8px 40px rgba(0,0,0,.50);--bl:blur(22px) saturate(160%);--bs:blur(12px);--bg:#06070f;--th:rgba(255,255,255,.92);--tm:rgba(255,255,255,.55);--tl:rgba(255,255,255,.30);--r:16px;--rs:10px;--t:.22s cubic-bezier(.4,0,.2,1);}
        *,*::before,*::after{box-sizing:border-box;}
        html,body{font-family:'DM Sans',sans-serif!important;color:var(--tm);background:var(--bg)!important;-webkit-font-smoothing:antialiased;}
        body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(117,113,249,.18) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 100%,rgba(56,189,248,.12) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 50% 50%,rgba(167,139,250,.07) 0%,transparent 70%);}
        body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.030;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;}
        #main-wrapper{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(117,113,249,.35);border-radius:99px;}
        h1,h2,h3,h4,h5,h6{font-family:'Syne',sans-serif!important;color:var(--th)!important;font-weight:700;letter-spacing:-.02em;}
        a{color:var(--a2);text-decoration:none;transition:color var(--t);}a:hover{color:#fff;text-decoration:none;}
        small,.text-muted{color:var(--tl)!important;}.text-primary{color:var(--a2)!important;}.text-white{color:#fff!important;}p,span,td,li{color:var(--tm);}
        .nav-header{background:rgba(117,113,249,.14)!important;border-right:1px solid var(--gbd)!important;border-bottom:1px solid var(--gbd)!important;}
        .nk-sidebar{background:rgba(13,15,30,.72)!important;backdrop-filter:var(--bl)!important;-webkit-backdrop-filter:var(--bl)!important;border-right:1px solid var(--gbd)!important;box-shadow:4px 0 40px rgba(0,0,0,.40)!important;}
        .nk-sidebar .metismenu,.nk-sidebar .metismenu ul{background:transparent!important;}
        .nk-sidebar .metismenu > li > a,.nk-sidebar .metismenu a{display:flex;align-items:center;gap:10px;padding:10px 22px!important;margin:2px 10px;border-radius:var(--rs)!important;color:var(--tm)!important;font-size:.84rem;font-weight:500;border:1px solid transparent;transition:all var(--t)!important;background:transparent!important;}
        .nk-sidebar .metismenu > li > a:hover,.nk-sidebar .metismenu a:hover{color:var(--th)!important;background:var(--gh)!important;border-color:var(--gbd)!important;}
        .nk-sidebar .metismenu > li.active > a,.nk-sidebar .metismenu > li.mm-active > a{color:#fff!important;background:linear-gradient(135deg,rgba(117,113,249,.40),rgba(117,113,249,.18))!important;border-color:rgba(117,113,249,.40)!important;box-shadow:0 4px 18px rgba(117,113,249,.28)!important;}
        .nk-sidebar .metismenu a i{color:inherit!important;opacity:.8;}
        .header{background:rgba(13,15,30,.65)!important;backdrop-filter:var(--bs)!important;-webkit-backdrop-filter:var(--bs)!important;border-bottom:1px solid var(--gbd)!important;box-shadow:none!important;}
        .hamburger .line{background:var(--tm)!important;}.hamburger:hover .line{background:var(--th)!important;}
        .header-right .icons > a{color:var(--tm)!important;}
        .user-img{border:2px solid var(--a)!important;border-radius:50%!important;box-shadow:0 0 12px rgba(117,113,249,.40)!important;}
        .activity.active{background:linear-gradient(230deg,#ffc480,#ff763b)!important;box-shadow:0 0 8px rgba(255,118,59,.6)!important;}
        .dropdown-menu{background:rgba(17,19,39,.94)!important;backdrop-filter:var(--bl)!important;-webkit-backdrop-filter:var(--bl)!important;border:1px solid var(--gbd)!important;border-radius:var(--r)!important;box-shadow:0 16px 48px rgba(0,0,0,.50)!important;padding:8px!important;}
        .dropdown-item{color:var(--tm)!important;border-radius:var(--rs)!important;padding:9px 16px!important;transition:all var(--t)!important;}
        .dropdown-item:hover{background:var(--gh)!important;color:var(--th)!important;}
        .drop-down{background:rgba(13,15,30,.92)!important;border:1px solid var(--gbd)!important;}
        .dropdown-content-body ul li a{color:var(--tm)!important;}.dropdown-content-body ul li a:hover{color:var(--th)!important;background:var(--gh)!important;}
        .content-body,.container-fluid{background:transparent!important;}
        /* Subject cards */
        .card{background:var(--gb)!important;backdrop-filter:var(--bl)!important;-webkit-backdrop-filter:var(--bl)!important;border:1px solid var(--gbd)!important;border-radius:var(--r)!important;box-shadow:var(--gs)!important;position:relative;overflow:hidden;transition:border-color var(--t),box-shadow var(--t),transform var(--t);}
        .card::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 55%);z-index:0;}
        .card > *{position:relative;z-index:1;}
        .card:hover{border-color:var(--gbs)!important;box-shadow:0 20px 60px rgba(0,0,0,.60),0 0 0 1px rgba(117,113,249,.18)!important;transform:translateY(-4px);}
        .card-body{padding:24px!important;}
        .card.gradient-4{background:linear-gradient(135deg,rgba(14,76,253,.55),rgba(106,142,255,.32))!important;border-color:rgba(106,142,255,.35)!important;box-shadow:0 8px 32px rgba(14,76,253,.30)!important;}
        .card.gradient-3{background:linear-gradient(135deg,rgba(255,118,59,.48),rgba(255,196,128,.28))!important;border-color:rgba(255,196,128,.30)!important;box-shadow:0 8px 32px rgba(255,118,59,.25)!important;}
        .card.gradient-4 h3,.card.gradient-4 h2,.card.gradient-4 p,
        .card.gradient-3 h3,.card.gradient-3 h2,.card.gradient-3 p{color:#fff!important;text-shadow:0 1px 4px rgba(0,0,0,.30);}
        /* Subject card label (section) */
        .card h3.card-title{font-size:.80rem!important;font-weight:700!important;letter-spacing:.10em;text-transform:uppercase;opacity:.80;}
        .card h2{font-size:1.35rem!important;line-height:1.2;margin-bottom:6px!important;}
        /* Buttons on cards */
        .btn{font-family:'DM Sans',sans-serif!important;font-weight:600!important;border-radius:var(--rs)!important;transition:all var(--t)!important;position:relative;overflow:hidden;}
        .btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s ease;}
        .btn:hover::after{left:140%;}
        .btn-light{background:rgba(255,255,255,.18)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important;backdrop-filter:blur(8px);}
        .btn-light:hover{background:rgba(255,255,255,.28)!important;color:#fff!important;}
        .btn-warning{background:rgba(251,191,36,.25)!important;border:1px solid rgba(251,191,36,.45)!important;color:#fde68a!important;}
        .btn-warning:hover{background:rgba(251,191,36,.40)!important;color:#fff!important;}
        .btn-rounded{border-radius:50px!important;}
        /* Empty state */
        .card.bg-light{background:rgba(255,255,255,.04)!important;border:2px dashed rgba(255,255,255,.12)!important;}
        .card.bg-light h4{color:var(--tl)!important;}.card.bg-light i{color:var(--tl)!important;}
        /* Footer */
        .footer,.footer .copyright{background:rgba(13,15,30,.60)!important;border-top:1px solid var(--gbd)!important;}
        .footer p,.copyright p{color:var(--tl)!important;}
        #preloader{background:var(--bg)!important;position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;}
        .path{stroke:var(--a)!important;}
        @keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .card{animation:fadeSlideUp .40s ease both;}
        .card:nth-child(1){animation-delay:.05s;}.card:nth-child(2){animation-delay:.10s;}.card:nth-child(3){animation-delay:.15s;}.card:nth-child(4){animation-delay:.20s;}
    </style>
</head>
<body>
<div id="preloader"><div class="loader"><svg class="circular" viewBox="25 25 50 50"><circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10"/></svg></div></div>

<div id="main-wrapper">
    <div class="nav-header">
        <div class="brand-logo">
            <a th:href="@{/}">
                <b class="logo-abbr"><img src="images/logo.png" alt=""></b>
                <span class="logo-compact"><img src="./images/logo-compact.png" alt=""></span>
                <span class="brand-title"><img src="images/logo-text.png" alt=""></span>
            </a>
        </div>
    </div>

    <div class="header">
        <div class="header-content clearfix">
            <div class="nav-control">
                <div class="hamburger"><span class="toggle-icon"><i class="icon-menu"></i></span></div>
            </div>
            <div class="header-right">
                <ul class="clearfix">
                    <li class="icons dropdown">
                        <div class="user-img c-pointer position-relative" data-toggle="dropdown">
                            <span class="activity active"></span>
                            <img th:src="${user.profilePictureUrl != null ? user.profilePictureUrl : 'images/user/1.png'}" height="40" width="40" alt="">
                        </div>
                        <div class="drop-down dropdown-profile dropdown-menu">
                            <div class="dropdown-content-body">
                                <ul>
                                    <li><a th:href="@{/profile}"><i class="icon-user"></i> <span>Profile</span></a></li>
                                    <li><a th:href="@{/inbox}"><i class="icon-envelope-open"></i> <span>Inbox</span></a></li>
                                    <li><a th:href="@{/login}"><i class="icon-key"></i> <span>Logout</span></a></li>
                                </ul>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="nk-sidebar">
        <div class="nk-nav-scroll">
            <ul class="metismenu" id="menu">
                <li><a th:href="@{/}"><i class="icon-speedometer menu-icon"></i><span class="nav-text">Dashboard</span></a></li>
                <li><a th:href="@{/profile}"><i class="icon-user menu-icon"></i><span class="nav-text">Profile</span></a></li>
                <li><a th:href="@{/inbox}"><i class="icon-envelope menu-icon"></i><span class="nav-text">Mail</span></a></li>
            </ul>
        </div>
    </div>

    <div class="content-body">
        <div class="container-fluid mt-3">
            <div class="row">
                <div class="col-lg-3 col-sm-6" th:each="classItem : ${teacherClasses}">
                    <div class="card shadow-sm" th:classappend="${classItemStat.index % 2 == 0 ? 'gradient-4' : 'gradient-3'}">
                        <div class="card-body">
                            <h3 class="card-title text-white mb-0" th:text="${classItem.section}">Section</h3>
                            <h2 class="text-white mt-1" th:text="${classItem.subject}">Subject</h2>
                            <p class="text-white mb-0" th:text="${classItem.startTime}">Schedule</p>
                            <div class="mt-4" style="display:flex;gap:8px;flex-wrap:wrap;">
                                <a th:href="@{/scores(subjectName=${classItem.subject}, userEmail=${user.email})}"
                                   class="btn btn-light btn-sm btn-rounded font-weight-bold shadow">
                                    <i class="icon-chart mr-1"></i> View My Scores
                                </a>
                                <a th:href="@{/redeem(subjectName=${classItem.subject}, section=${classItem.section})}"
                                   class="btn btn-warning btn-sm btn-rounded font-weight-bold shadow">
                                    <i class="icon-badge mr-1"></i> Redeem
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center" th:if="${#lists.isEmpty(teacherClasses)}">
                    <div class="card bg-light">
                        <div class="card-body py-5">
                            <i class="fa fa-book-open display-3 text-muted mb-3"></i>
                            <h4 class="text-muted">You are not enrolled in any subjects yet.</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer"><div class="copyright"><p>Copyright &copy; 2026 Archiva System</p></div></div>
</div>

<script src="plugins/common/common.min.js"></script>
<script src="js/custom.min.js"></script>
<script src="js/settings.js"></script>
<script src="js/gleek.js"></script>
<script src="js/styleSwitcher.js"></script>
</body>
</html>
