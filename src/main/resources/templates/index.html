<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Archiva - Student Performance Tracker System</title>
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon.png">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

<div id="preloader">
    <div class="loader">
        <svg class="circular" viewBox="25 25 50 50">
            <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10" />
        </svg>
    </div>
</div>

<div id="main-wrapper">

    <div class="nav-header">
        <div class="brand-logo">
            <a th:href="@{/}">
                <b class="logo-abbr"><img src="images/logo.png" alt=""> </b>
                <span class="logo-compact"><img src="./images/logo-compact.png" alt=""></span>
                <span class="brand-title"><img src="images/logo-text.png" alt=""></span>
            </a>
        </div>
    </div>

    <div class="header">
        <div class="header-content clearfix">
            <div class="nav-control">
                <div class="hamburger">
                    <span class="toggle-icon"><i class="icon-menu"></i></span>
                </div>
            </div>
            <div class="header-right">
                <ul class="clearfix">
                    <li class="icons dropdown">
                        <div class="user-img c-pointer position-relative" data-toggle="dropdown">
                            <span class="activity active"></span>
                            <img th:src="${user.profilePictureUrl != null ? user.profilePictureUrl : 'images/user/1.png'}"
                                 height="40" width="40" alt="">
                        </div>
                        <div class="drop-down dropdown-profile dropdown-menu">
                            <div class="dropdown-content-body">
                                <ul>
                                    <li><a th:href="@{/profile}"><i class="icon-user"></i> <span>Profile</span></a></li>
                                    <li><a th:href="@{/inbox}"><i class="icon-envelope-open"></i> <span>Inbox</span></a></li>
                                    <li><a th:href="@{/login}"><i class="icon-key"></i> <span>Logout</span></a></li>
                                </ul>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="nk-sidebar">
        <div class="nk-nav-scroll">
            <ul class="metismenu" id="menu">
                <li><a th:href="@{/}"><i class="icon-speedometer menu-icon"></i><span class="nav-text">Dashboard</span></a></li>
                <li><a th:href="@{/profile}"><i class="icon-user menu-icon"></i><span class="nav-text">Profile</span></a></li>
                <li><a th:href="@{/inbox}"><i class="icon-envelope menu-icon"></i><span class="nav-text">Mail</span></a></li>
            </ul>
        </div>
    </div>

    <div class="content-body">
        <div class="container-fluid mt-3">
            <div class="row">

                <div class="col-lg-3 col-sm-6" th:each="classItem : ${teacherClasses}">
                    <div class="card shadow-sm"
                         th:classappend="${classItemStat.index % 2 == 0 ? 'gradient-4' : 'gradient-3'}">
                        <div class="card-body">

                            <h3 class="card-title text-white mb-0" th:text="${classItem.section}">Section</h3>
                            <h2 class="text-white mt-1" th:text="${classItem.subject}">Subject</h2>
                            <p class="text-white mb-0" th:text="${classItem.startTime}">Schedule</p>

                            <div class="mt-4" style="display:flex; gap:8px; flex-wrap:wrap;">

                                <!-- Unchanged: View My Scores -->
                                <a th:href="@{/scores(subjectName=${classItem.subject}, userEmail=${user.email})}"
                                   class="btn btn-light btn-sm btn-rounded text-primary font-weight-bold shadow">
                                    View My Scores
                                </a>

                                <!--
                                    FIX: passes BOTH subjectName AND section so
                                    RedeemController can look up the correct
                                    per-subject points balance from StudentPoints table.
                                -->
                                <a th:href="@{/redeem(subjectName=${classItem.subject}, section=${classItem.section})}"
                                   class="btn btn-warning btn-sm btn-rounded font-weight-bold shadow">
                                    <i class="icon-badge mr-1"></i> Redeem
                                </a>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center" th:if="${#lists.isEmpty(teacherClasses)}">
                    <div class="card bg-light">
                        <div class="card-body py-5">
                            <i class="fa fa-book-open display-3 text-muted mb-3"></i>
                            <h4 class="text-muted">You are not enrolled in any subjects yet.</h4>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="footer">
        <div class="copyright">
            <p>Copyright &copy; 2026 Archiva System</p>
        </div>
    </div>
</div>

<script src="plugins/common/common.min.js"></script>
<script src="js/custom.min.js"></script>
<script src="js/settings.js"></script>
<script src="js/gleek.js"></script>
<script src="js/styleSwitcher.js"></script>

</body>
</html>
