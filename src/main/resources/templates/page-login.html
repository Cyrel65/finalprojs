<!DOCTYPE html>
<html class="h-100" lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Archiva - Student Performance Tracker System Themefisher.com</title>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon.png}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        /* ── Reset & Base ─────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent:       #7571f9;
            --accent2:      #a78bfa;
            --accent3:      #38bdf8;
            --glass-bg:     rgba(255,255,255,0.045);
            --glass-border: rgba(255,255,255,0.10);
            --glass-strong: rgba(255,255,255,0.16);
            --text-primary: rgba(255,255,255,0.92);
            --text-dim:     rgba(255,255,255,0.50);
            --text-muted:   rgba(255,255,255,0.30);
            --radius:       18px;
            --radius-sm:    11px;
            --transition:   0.22s cubic-bezier(0.4,0,0.2,1);
        }

        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: #06070f;
            color: var(--text-dim);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Animated Background ──────────────────── */
        .login-form-bg {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse 90% 70% at 15% -10%,  rgba(117,113,249,0.22) 0%, transparent 60%),
                radial-gradient(ellipse 70% 60% at 85% 110%,  rgba(56,189,248,0.14)  0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 50%  50%,  rgba(167,139,250,0.07) 0%, transparent 70%),
                #06070f;
        }

        /* Noise grain */
        .login-form-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.032;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating orbs */
        .login-form-bg::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(117,113,249,0.12), transparent 70%);
            top: -120px; left: -120px;
            animation: floatOrb 12s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatOrb {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(60px, 80px) scale(1.15); }
        }

        /* ── Container ────────────────────────────── */
        .login-form-bg .container {
            position: relative;
            z-index: 1;
        }

        .form-input-content {
            padding: 40px 0;
            animation: fadeSlideUp 0.55s cubic-bezier(0.4,0,0.2,1) both;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Card ─────────────────────────────────── */
        .card.login-form {
            background: rgba(255,255,255,0.042) !important;
            backdrop-filter: blur(28px) saturate(160%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(160%) !important;
            border: 1px solid var(--glass-strong) !important;
            border-radius: var(--radius) !important;
            box-shadow:
                0 0 0 1px rgba(117,113,249,0.10),
                0 24px 80px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.08) !important;
            overflow: hidden;
            position: relative;
        }

        /* Card inner highlight streak */
        .card.login-form::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.20), transparent);
            pointer-events: none;
        }

        /* Top accent bar */
        .card.login-form::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .card-body.pt-5 {
            padding: 48px 44px 44px !important;
        }

        /* ── Brand / Logo ─────────────────────────── */
        a.text-center {
            display: block;
            text-align: center;
            text-decoration: none;
        }

        a.text-center h4 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.7rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 30%, var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0;
            display: inline-block;
        }

        /* Dot accent under brand */
        a.text-center::after {
            content: '';
            display: block;
            width: 32px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 99px;
            margin: 10px auto 0;
        }

        /* ── Form ─────────────────────────────────── */
        form.login-input {
            margin-top: 36px !important;
            margin-bottom: 28px !important;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-control {
            background: rgba(255,255,255,0.055) !important;
            border: 1px solid rgba(255,255,255,0.10) !important;
            border-radius: var(--radius-sm) !important;
            color: var(--text-primary) !important;
            font-family: 'DM Sans', sans-serif !important;
            font-size: 0.9rem !important;
            font-weight: 400;
            padding: 13px 18px !important;
            height: auto !important;
            transition: border-color var(--transition), background var(--transition), box-shadow var(--transition) !important;
            outline: none !important;
        }

        .form-control::placeholder {
            color: var(--text-muted) !important;
            font-weight: 300;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.085) !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(117,113,249,0.20), 0 2px 12px rgba(117,113,249,0.15) !important;
            color: var(--text-primary) !important;
        }

        /* ── Submit Button ────────────────────────── */
        .btn.login-form__btn.submit {
            width: 100%;
            padding: 13px 24px !important;
            background: linear-gradient(135deg, #7571f9 0%, #a78bfa 100%) !important;
            border: none !important;
            border-radius: var(--radius-sm) !important;
            color: #fff !important;
            font-family: 'Syne', sans-serif !important;
            font-weight: 700 !important;
            font-size: 0.95rem !important;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(117,113,249,0.45) !important;
            transition: all var(--transition) !important;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }

        .btn.login-form__btn.submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.55s ease;
        }

        .btn.login-form__btn.submit:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 8px 32px rgba(117,113,249,0.60) !important;
            filter: brightness(1.08);
        }

        .btn.login-form__btn.submit:hover::before {
            left: 140%;
        }

        .btn.login-form__btn.submit:active {
            transform: translateY(0) !important;
        }

        /* ── Error Alert ──────────────────────────── */
        .alert.alert-danger {
            background: rgba(239,68,68,0.12) !important;
            border: 1px solid rgba(239,68,68,0.28) !important;
            border-radius: var(--radius-sm) !important;
            color: #fca5a5 !important;
            font-size: 0.84rem;
            padding: 12px 16px !important;
            margin-top: 16px !important;
        }

        .alert.alert-danger p { margin: 0; color: inherit !important; }

        /* ── Footer Links ─────────────────────────── */
        p.login-form__footer {
            font-size: 0.84rem;
            color: var(--text-muted) !important;
            text-align: center;
            margin-top: 12px !important;
            margin-bottom: 0 !important;
        }

        p.login-form__footer a,
        p.login-form__footer .text-primary {
            color: var(--accent2) !important;
            font-weight: 500;
            text-decoration: none;
            transition: color var(--transition);
            -webkit-text-fill-color: unset !important;
        }

        p.login-form__footer a:hover {
            color: #fff !important;
        }

        /* ── Preloader ────────────────────────────── */
        #preloader {
            position: fixed;
            inset: 0;
            background: #06070f !important;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader .circular {
            width: 40px;
            height: 40px;
            animation: rotate 1.4s linear infinite;
        }

        .loader .path {
            stroke: var(--accent);
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: dash 1.4s ease-in-out infinite;
            stroke-linecap: round;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        @keyframes dash {
            0%   { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
            50%  { stroke-dasharray: 89, 200; stroke-dashoffset: -35px; }
            100% { stroke-dasharray: 89, 200; stroke-dashoffset: -124px; }
        }

        /* ── Scrollbar ────────────────────────────── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(117,113,249,0.35); border-radius: 99px; }

        /* ── Responsive ───────────────────────────── */
        @media (max-width: 576px) {
            .card-body.pt-5 { padding: 36px 24px 32px !important; }
        }
    </style>
</head>

<body class="h-100">

<!--*******************
    Preloader start
********************-->
<div id="preloader">
    <div class="loader">
        <svg class="circular" viewBox="25 25 50 50">
            <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10" />
        </svg>
    </div>
</div>
<!--*******************
    Preloader end
********************-->

<div class="login-form-bg h-100">
    <div class="container h-100">
        <div class="row justify-content-center h-100">
            <div class="col-xl-6">
                <div class="form-input-content">
                    <div class="card login-form mb-0">
                        <div class="card-body pt-5">
                            <a class="text-center" th:href="@{/}"> <h4>Archiva</h4></a>

                            <form class="mt-5 mb-5 login-input" th:action="@{/login}" method="post">
                                <div class="form-group">
                                    <input type="email" class="form-control" placeholder="Email" name="email" required>
                                </div>

                                <div class="form-group">
                                    <input type="password" class="form-control" placeholder="Password" name="password" required>
                                </div>

                                <button type="submit" class="btn login-form__btn submit w-100">Sign In</button>

                                <div th:if="${loginError}" class="alert alert-danger mt-3" role="alert">
                                    <p th:text="${loginError}"></p>
                                </div>

                            </form>
                            <p class="mt-5 login-form__footer">Dont have account? <a th:href="@{/register}" class="text-primary">Sign Up</a> now</p>
                            <p class="mt-2 login-form__footer">
                                <a th:href="@{/forgotpass}" class="text-primary">Forgot Password?</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--**********************************
    Scripts
***********************************-->
<script src="plugins/common/common.min.js"></script>
<script src="js/custom.min.js"></script>
<script src="js/settings.js"></script>
<script src="js/gleek.js"></script>
<script src="js/styleSwitcher.js"></script>
</body>
</html>
